<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0a0a0a"><title>Sin conexión · Urithiru</title><style>body{margin:0;background:#0a0a0a;color:#eee;font:15px system-ui;padding:8vw;line-height:1.6}main{max-width:850px;margin:auto}h1{font-size:27px}p,small{color:#aaa}a{color:#b7da80}table{width:100%;border-collapse:collapse;margin:2rem 0}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #333}th{color:#aaa;font-weight:500}.scroll{overflow-x:auto}</style><main><img src="/icon.svg" width="40" height="40" alt=""><h1>Estás sin conexión</h1><p id="description">Vuelve a conectarte para verificar tu sesión y actualizar los datos.</p><div id="snapshot"></div><a href="/">Volver a intentar</a><p><button id="clear" style="background:transparent;color:#aaa;border:1px solid #444;padding:8px 12px;border-radius:6px;cursor:pointer">Borrar datos de este dispositivo</button></p></main><script>try{const state=JSON.parse(localStorage.getItem('centralita-v1')||'null')?.state;const session=state?.session;const snapshots=Object.entries(state?.snapshots||{}).filter(([key])=>key.startsWith(session?.userId+':'));const data=snapshots.at(-1)?.[1];if(session&&data){document.getElementById('description').textContent='Última lectura guardada: '+new Date(data.fetchedAt).toLocaleString('es-ES')+'. Estos datos pueden haber cambiado.';const table=document.createElement('table');const header=document.createElement('tr');['Proyecto','Páginas vistas','Visitantes'].forEach(text=>{const cell=document.createElement('th');cell.textContent=text;header.appendChild(cell)});table.appendChild(header);data.projects.forEach(project=>{const row=document.createElement('tr');[project.name,project.analytics?.pageviews??'—',project.analytics?.visitors??'—'].forEach(value=>{const cell=document.createElement('td');cell.textContent=String(value);row.appendChild(cell)});table.appendChild(row)});const container=document.getElementById('snapshot');container.className='scroll';container.appendChild(table)}}catch{}document.getElementById('clear').onclick=async()=>{localStorage.removeItem('centralita-v1');localStorage.removeItem('centralita-theme');for(const key of await caches.keys()){if(key.startsWith('centralita-'))await caches.delete(key)}document.getElementById('snapshot').replaceChildren();document.getElementById('description').textContent='Datos locales borrados.'}</script></html>
